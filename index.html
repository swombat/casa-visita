<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casa · virtual visit</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ec;font-family:system-ui,sans-serif}
  #ui{position:fixed;top:10px;left:10px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
  #ui button{border:0;border-radius:8px;padding:8px 12px;background:#fff;box-shadow:0 1px 4px #0003;font-size:14px;cursor:pointer}
  #ui button.on{background:#1f6f78;color:#fff}
  #help{position:fixed;bottom:10px;left:10px;right:10px;z-index:5;font-size:13px;color:#234;background:#fffc;border-radius:8px;padding:8px 10px;max-width:640px}
  canvas{display:block;touch-action:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <button data-f="0">Planta baja</button>
  <button data-f="1">Planta 1ª</button>
  <button data-f="2">Planta 2ª</button>
  <button id="doll">Dollhouse view</button>
</div>
<div id="help">Walk: click the view, then WASD / arrows + mouse (Esc to release). Phone: drag left half to walk, right half to look. Floors via the buttons (or keys 1 2 3). Traced by eye from the listing's plans at 1:75, so expect ±30 cm.</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const PX=51, CX=600, CY=300, H=2.7, STOREY=3.0, T=0.15;
// Per-floor offset (pixels in each plan image) that aligns it to the ground-floor plan.
const FLOORS=[
 {off:[0,0], tint:0xe9dcc6, walls:[], rails:[], boxes:[], slabs:[], labels:[]},
 {off:[40,40], tint:0xd9e4d2, walls:[], rails:[], boxes:[], slabs:[], labels:[]},
 {off:[35,40], tint:0xd8dfea, walls:[], rails:[], boxes:[], slabs:[], labels:[]},
];
let F;
const w=(x1,y1,x2,y2,gaps=[])=>F.walls.push({x1,y1,x2,y2,gaps});
const d=(x1,y1,x2,y2)=>F.walls.push({x1,y1,x2,y2,gaps:'door'});
const rail=(x1,y1,x2,y2)=>F.rails.push([x1,y1,x2,y2]);
const box=(x1,y1,x2,y2,h,c)=>F.boxes.push([x1,y1,x2,y2,h,c]);
const slab=(pts,opts={})=>F.slabs.push({pts,...opts});
const label=(t,x,y)=>F.labels.push([t,x,y]);

// ---------- Planta baja (ground) ----------
F=FLOORS[0];
slab([[233,47],[672,47],[672,108],[955,108],[955,460],[900,505],[233,505]]);
slab([[955,100],[1115,100],[1115,560],[1095,615],[1050,655],[990,672],[885,672],[885,505],[900,505],[955,460]],{color:0xcfc4b0});
slab([[955,100],[1115,100],[1115,560],[1095,615],[1050,655],[990,672],[885,672],[885,505],[900,505],[955,460]],{color:0x9a6a50,y:2.85,opacity:0.35,noWalk:true});
slab([[672,47],[955,47],[955,100],[672,100]],{color:0xcfc4b0});
w(233,47,672,47);
w(672,47,672,108,[[60,100,'w']]);
w(233,47,233,505);
w(233,505,900,505,[[305,355,'w'],[370,413,'d'],[525,585,'w'],[760,850,'w']]);
w(955,108,955,460,[[150,235,'w'],[305,410,'w']]);
d(955,460,900,505);
w(430,108,955,108,[[580,625,'d'],[685,735,'w']]);
w(500,47,500,108);
w(430,108,430,255);
w(578,108,578,250,[[160,215,'d']]);
w(625,108,625,245,[[140,185,'d']]);
w(430,250,578,250);
w(625,245,780,245);
w(780,108,780,245);
w(233,255,430,255,[[305,415,'o']]);
w(430,255,430,505,[[270,320,'d']]);
w(430,328,625,328,[[580,620,'d']]);
w(625,255,625,505,[[255,320,'o']]);
box(245,258,275,465,0.9,0xb9b2a6);   // kitchen counter
box(845,112,885,145,1.2,0x9b8f80);   // fireplace
label('Cocina',345,380);label('Distribuidor',360,200);label('Lavadero',465,75);label('Baño 1',585,75);
label('Cuarto',505,180);label('Dormitorio 2',700,180);label('Pasillo',520,290);label('Dormitorio 1',525,410);
label('Estar · comedor',790,350);label('Porche',1040,390);label('Patio lateral',815,72);

// ---------- Planta 1ª ----------
F=FLOORS[1];
slab([[208,140],[265,140],[265,85],[490,85],[490,152],[715,152],[715,145],[830,145],[830,275],[722,275],[722,548],[95,548]]);
slab([[722,145],[975,145],[975,480],[900,548],[722,548]],{color:0xc9b9a0});
w(208,140,265,140);
w(265,85,265,290);
w(265,85,490,85);
w(490,85,490,152);
w(490,152,715,152,[[640,680,'w']]);
w(715,152,715,292);
w(580,152,580,292);
w(580,292,715,292,[[665,710,'d']]);
w(730,145,830,145);w(830,145,830,275);w(730,145,730,275);w(730,275,830,275,[[785,825,'d']]);
w(722,292,722,548,[[300,340,'d'],[410,470,'w']]);
w(208,140,95,548);
w(95,548,722,548,[[175,270,'w'],[385,480,'w'],[565,660,'w']]);
w(180,290,332,290,[[238,275,'d']]);
w(190,282,265,282);
w(265,288,490,288,[[290,320,'o'],[320,430,'w']]);
w(332,290,332,548);
w(332,335,505,335,[[345,385,'d']]);
w(505,345,505,548);
w(505,345,722,345,[[595,630,'d']]);
rail(830,145,975,145);rail(975,145,975,480);rail(975,480,900,548);rail(900,548,722,548);
box(585,160,620,250,0.55,0xffffff); // bath
label('Sala de máquinas',225,215);label('Dormitorio 3',240,435);label('Dormitorio 4',418,440);
label('Dormitorio 5',617,440);label('Pasillo',440,312);label('Baño 2',660,215);label('Caldera',780,210);label('Terraza',855,385);

// ---------- Planta 2ª ----------
F=FLOORS[2];
slab([[175,245],[270,245],[270,282],[485,282],[485,140],[738,140],[738,405],[150,405]]);
slab([[510,405],[680,405],[680,480],[510,480]],{color:0xc9b9a0});
w(485,140,738,140);
w(485,140,485,282);
w(270,282,485,282,[[375,470,'w']]);
w(270,245,270,282);
w(175,245,270,245);
w(175,245,150,405);
w(150,405,738,405,[[205,240,'w'],[245,295,'w'],[310,360,'w'],[375,430,'w'],[520,680,'d']]);
w(738,140,738,405,[[290,350,'w']]);
w(235,285,235,405,[[335,365,'d']]);
w(175,272,270,272,[[200,250,'d']]);
rail(510,405,510,480);rail(510,480,680,480);rail(680,480,680,405);
label('Sala',600,345);label('Baño 3',190,350);label('Armario',225,262);label('Balcón',595,445);

// ---------- scene ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xdfe7ec);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,200);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a7a66,1.6));
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(8,20,6);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0xa8b89a}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);

const wallMat=new THREE.MeshLambertMaterial({color:0xf4f1ea});
const glassMat=new THREE.MeshLambertMaterial({color:0x9fd0e8,transparent:true,opacity:0.3});
const railMat=new THREE.MeshLambertMaterial({color:0x555555});

const groups=[];
const colliders=[[],[],[]];
function toM(f,x,y){const o=FLOORS[f].off;return [(x-o[0]-CX)/PX,(y-o[1]-CY)/PX];}
function seg(g,f,a,b,y0,y1,mat,collide){
  const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);if(len<0.01||y1<=y0)return;
  const m=new THREE.Mesh(new THREE.BoxGeometry(len+T,y1-y0,T),mat);
  m.position.set((a[0]+b[0])/2,f*STOREY+(y0+y1)/2,(a[1]+b[1])/2);
  m.rotation.y=-Math.atan2(dz,dx);g.add(m);
  if(collide)colliders[f].push([a,b]);
}
FLOORS.forEach((fl,f)=>{
  const g=new THREE.Group();groups.push(g);scene.add(g);
  for(const s of fl.slabs){
    const shape=new THREE.Shape(s.pts.map(p=>{const m=toM(f,p[0],p[1]);return new THREE.Vector2(m[0],-m[1]);}));
    const geo=new THREE.ExtrudeGeometry(shape,{depth:0.2,bevelEnabled:false});geo.rotateX(-Math.PI/2);
    const mat=new THREE.MeshLambertMaterial({color:s.color||fl.tint,transparent:!!s.opacity,opacity:s.opacity||1,side:THREE.DoubleSide});
    const m=new THREE.Mesh(geo,mat);m.position.y=f*STOREY+(s.y??-0.2);g.add(m);
  }
  for(const W of fl.walls){
    const A=toM(f,W.x1,W.y1),B=toM(f,W.x2,W.y2);
    if(W.gaps==='door'){seg(g,f,A,B,2.1,H,wallMat,false);continue;}
    const horiz=Math.abs(W.x2-W.x1)>=Math.abs(W.y2-W.y1);
    const s0=horiz?W.x1:W.y1,s1=horiz?W.x2:W.y2,lo=Math.min(s0,s1),hi=Math.max(s0,s1);
    const at=v=>{const t=(v-s0)/(s1-s0);return [A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t];};
    let cur=lo;
    for(const [a,b,k] of [...W.gaps].sort((p,q)=>p[0]-q[0])){
      seg(g,f,at(cur),at(a),0,H,wallMat,true);
      if(k==='w'){seg(g,f,at(a),at(b),0,0.9,wallMat,true);seg(g,f,at(a),at(b),2.1,H,wallMat,false);seg(g,f,at(a),at(b),0.9,2.1,glassMat,false);}
      if(k==='d')seg(g,f,at(a),at(b),2.1,H,wallMat,false);
      cur=b;
    }
    seg(g,f,at(cur),at(hi),0,H,wallMat,true);
  }
  for(const r of fl.rails)seg(g,f,toM(f,r[0],r[1]),toM(f,r[2],r[3]),0,1.0,railMat,true);
  for(const [x1,y1,x2,y2,h,c] of fl.boxes){
    const a=toM(f,x1,y1),b=toM(f,x2,y2);
    const m=new THREE.Mesh(new THREE.BoxGeometry(b[0]-a[0],h,b[1]-a[1]),new THREE.MeshLambertMaterial({color:c}));
    m.position.set((a[0]+b[0])/2,f*STOREY+h/2,(a[1]+b[1])/2);g.add(m);
  }
  for(const [t,x,y] of fl.labels){
    const c=document.createElement('canvas');c.width=512;c.height=96;const x2=c.getContext('2d');
    x2.font='bold 52px system-ui';x2.textAlign='center';x2.fillStyle='#1f3b44';x2.fillText(t,256,66);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
    const m=toM(f,x,y);sp.position.set(m[0],f*STOREY+2.2,m[1]);sp.scale.set(1.6,0.3,1);g.add(sp);
  }
});
// Stairs (visual): spiral ground→1, straight 1→2.
{const g=groups[0],[cx,cz]=toM(0,320,175),r=85/PX,n=16;
 for(let i=0;i<n;i++){const a=Math.PI+i*(Math.PI/n);const s=new THREE.Mesh(new THREE.BoxGeometry(r,0.05,0.28),new THREE.MeshLambertMaterial({color:0x8d7a64}));
  s.position.set(cx+Math.cos(a)*r/2,(i+1)*STOREY/(n+1),cz+Math.sin(a)*r/2);s.rotation.y=-a;g.add(s);}}
{const g=groups[1],n=16,[x0,z0]=toM(1,540,300),[,z1]=toM(1,540,160);
 for(let i=0;i<n;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,0.25),new THREE.MeshLambertMaterial({color:0x8d7a64}));
  s.position.set(x0,STOREY+(i+1)*STOREY/(n+1),z0+(z1-z0)*i/(n-1));g.add(s);}}

// ---------- controls ----------
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enabled=false;orbit.target.set(0,3,0);
let level=0,doll=false,yaw=Math.PI,pitch=0;const pos=new THREE.Vector3();
const SPAWN=[[520,290],[440,312],[600,345]];
function goFloor(f){level=f;doll=false;orbit.enabled=false;const [x,z]=toM(f,...SPAWN[f]);pos.set(x,f*STOREY+1.6,z);refresh();}
function refresh(){
  groups.forEach((g,i)=>g.visible=doll||i<=level);
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',doll?b.id==='doll':+b.dataset.f===level&&b.id!=='doll'));
}
document.querySelectorAll('#ui button[data-f]').forEach(b=>b.onclick=e=>{e.stopPropagation();goFloor(+b.dataset.f);});
document.getElementById('doll').onclick=e=>{e.stopPropagation();doll=true;document.exitPointerLock?.();orbit.enabled=true;camera.position.set(14,16,18);orbit.target.set(0,3,0);orbit.update();refresh();};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.key>='1'&&e.key<='3')goFloor(+e.key-1);});
addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(!doll&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock();});
addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*0.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*0.0022));}});
const touch={};let tmove=[0,0];
renderer.domElement.addEventListener('touchstart',e=>{if(doll)return;for(const t of e.changedTouches)touch[t.identifier]={x:t.clientX,y:t.clientY,left:t.clientX<innerWidth/2};},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(doll)return;for(const t of e.changedTouches){const s=touch[t.identifier];if(!s)continue;
  if(s.left)tmove=[(t.clientX-s.x)/60,(t.clientY-s.y)/60];else{yaw-=(t.clientX-s.x)*0.005;pitch=Math.max(-1.4,Math.min(1.4,pitch-(t.clientY-s.y)*0.005));s.x=t.clientX;s.y=t.clientY;}}},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(touch[t.identifier]?.left)tmove=[0,0];delete touch[t.identifier];}});
function collide(p){
  for(let k=0;k<2;k++)for(const [a,b] of colliders[level]){
    const ax=b[0]-a[0],az=b[1]-a[1],l2=ax*ax+az*az;let t=((p.x-a[0])*ax+(p.z-a[1])*az)/l2;t=Math.max(0,Math.min(1,t));
    const qx=a[0]+ax*t,qz=a[1]+az*t,dx=p.x-qx,dz=p.z-qz,dd=Math.hypot(dx,dz),R=0.28;
    if(dd<R&&dd>1e-6){p.x=qx+dx/dd*R;p.z=qz+dz/dd*R;}
  }
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(!doll){
    let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-tmove[1];
    let s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+tmove[0];
    yaw+=((keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0))*dt*1.8;
    f=Math.max(-1,Math.min(1,f));s=Math.max(-1,Math.min(1,s));
    const sp=2.2*dt;
    pos.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;pos.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
    collide(pos);
    camera.position.copy(pos);camera.rotation.set(pitch,yaw,0,'YXZ');
  }else orbit.update();
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
goFloor(0);loop();
</script>
</body>
</html>
